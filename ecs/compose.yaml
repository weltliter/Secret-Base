name: ${VAULT_PROJECT_NAME:?Use manage.sh with config.env}
services:
  db:
    image: ${POSTGRES_IMAGE:?Use manage.sh with config.env}
    network_mode: none
    environment:
      POSTGRES_DB: vault
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, "listen_addresses=", -c, "unix_socket_permissions=0770", -c, "hba_file=/etc/postgresql/vault-pg_hba.conf", -c, "shared_buffers=32MB", -c, "max_connections=15", -c, "log_statement=none", -c, "log_min_error_statement=panic"]
    volumes:
      - ${VAULT_STATE_DIR:?Use manage.sh with config.env}/data/postgres:/var/lib/postgresql/data
      - ${VAULT_STATE_DIR:?Use manage.sh with config.env}/data/pgsocket:/var/run/postgresql
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./ops/postgres/pg_hba.conf:/etc/postgresql/vault-pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vault_app -d vault"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 160m
    memswap_limit: 160m
    ulimits:
      core: 0
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
  app:
    image: ${VAULT_APP_IMAGE:?Use manage.sh with config.env}
    build:
      context: .
      args:
        PYTHON_BASE: ${PYTHON_BASE:?Use manage.sh with config.env}
        PIP_INDEX_URL: ${PIP_INDEX_URL:?Use manage.sh with config.env}
    ports: ["127.0.0.1:${VAULT_ADMIN_PORT:?Use manage.sh with config.env}:8000"]
    environment:
      DATABASE_URL: "dbname=vault user=vault_app host=/var/run/postgresql"
      VAULT_DATA_DIR: /data
      VAULT_QUERY_KEY_FILE: /run/secrets/query_unlock_key
      VAULT_EMBEDDING_DIR: /models
      VAULT_BACKUP_DIR: /backups/web
      VAULT_MAINTENANCE_LOCK: /backups/.backup.lock
      VAULT_BACKUP_TIMEOUT_SECONDS: ${VAULT_BACKUP_TIMEOUT_SECONDS:?Use manage.sh with config.env}
      VAULT_BACKUP_RETENTION_DAYS: ${VAULT_BACKUP_RETENTION_DAYS:?Use manage.sh with config.env}
      VAULT_BACKUP_QUOTA_BYTES: ${VAULT_BACKUP_QUOTA_BYTES:?Use manage.sh with config.env}
      VAULT_BACKUP_RESERVE_BYTES: ${VAULT_BACKUP_RESERVE_BYTES:?Use manage.sh with config.env}
      VAULT_DOWNLOAD_TIMEOUT_SECONDS: ${VAULT_DOWNLOAD_TIMEOUT_SECONDS:?Use manage.sh with config.env}
      VAULT_DOWNLOAD_CONCURRENCY: ${VAULT_DOWNLOAD_CONCURRENCY:?Use manage.sh with config.env}
    volumes:
      - ${VAULT_STATE_DIR:?Use manage.sh with config.env}/data/vault:/data
      - ${VAULT_STATE_DIR:?Use manage.sh with config.env}/data/pgsocket:/var/run/postgresql
      - ${VAULT_STATE_DIR:?Use manage.sh with config.env}/backups:/backups
      - type: bind
        source: ${VAULT_STATE_DIR:?Use manage.sh with config.env}/models/bge-small-zh-v1.5
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VAULT_STATE_DIR:?Use manage.sh with config.env}/secrets/query-unlock.key
        target: /run/secrets/query_unlock_key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
