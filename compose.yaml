name: wechat-vault
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    network_mode: none
    environment:
      POSTGRES_DB: vault
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, "listen_addresses=", -c, "unix_socket_permissions=0770", -c, "hba_file=/etc/postgresql/vault-pg_hba.conf", -c, "shared_buffers=32MB", -c, "max_connections=15", -c, "log_statement=none", -c, "log_min_error_statement=panic"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/pgsocket:/var/run/postgresql
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./ops/postgres/pg_hba.conf:/etc/postgresql/vault-pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vault_app -d vault"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 160m
    memswap_limit: 160m
    ulimits:
      core: 0
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
  app:
    build:
      context: .
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports: ["127.0.0.1:18080:8000"]
    environment:
      DATABASE_URL: "dbname=vault user=vault_app host=/var/run/postgresql"
      VAULT_DATA_DIR: /data
      VAULT_QUERY_KEY_FILE: /run/secrets/query_unlock_key
      VAULT_EMBEDDING_DIR: /models
    volumes:
      - ./data/vault:/data
      - ./data/pgsocket:/var/run/postgresql
      - type: bind
        source: ./models/bge-small-zh-v1.5
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/query-unlock.key
        target: /run/secrets/query_unlock_key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
